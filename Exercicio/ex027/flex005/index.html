<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        html,body{
            height: 100vh;
            background-color: lightsalmon;
        }
        main{
            height: 100vh;
           background-color: blue;
            display: flex;
            flex-flow: row wrap;border-radius: 0cqb;
            justify-content: center;
            align-items: center ;
         
        }
        section{
           background-color: lightseagreen; 
           width: 200px;
           height: 200px;
           border: 1px solid black;
        
        }
       
    </style>
</head>
<body>
    
        <main>
            <section>
                <h1>Tela de login</h1>
            </section>
        </main>
        
    
</body>
</html>
