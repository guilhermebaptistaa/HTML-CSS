<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            max-width: 400px;
            border-collapse: collapse;

        }

        thead th{
            background-color: gray;
            color: white;
        }

        th,td{
            border: solid 1px black;
            text-align: center;
            padding: 
            8px;
           
        }
        tr.media{
            background-color: gray;
            color: white;
            
        }
        

    </style>
</head>
<body>
    
    <table>

        <thead>

            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>

            </tr>

            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
                
            </tr>

        </thead>
<!--A parte do cabeçalho a sima feito-->
        <tbody>

            <tr>

                <th rowspan="4" scope="rowgroup">Exame</th>
                <td>Matemática</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>

            </tr>

            <tr>

                <td>Física</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>

            </tr>

            <tr>

                <td>Química</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>

            </tr>

            <tr>

                <td>Biologia</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>

            </tr>

            <tr class="media">
                <th colspan="4" scope="row">Médias de exatas</th>
                <td>00</td>
            </tr>

            <tr>

                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>

            </tr>

            <tr>

                <td>Geografia</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>

            </tr>

            <tr class="media">

                <th colspan="4" scope="rowgroup">Média de Humanas</th>
                <td>00</td>

            </tr>

        </tbody>



    </table>

</body>
</html>
