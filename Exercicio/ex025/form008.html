<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmlario</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    
        <form action="cadastro.php" method="get">

            <p>
                <label for="in1">Numero 1</label>
                <input type="number" name="n1" id="in1" min="0" max="30" required oninput="isoma.innerHTML =Number(in1.value) + Number (in2.value) " >
            </p>

            <p>
                <label for="in2">Numero 2</label>
                <input type="number" name="n2" id="in2" min="0" max="30" required oninput="isoma.innerHTML=Number(in1.value) + Number(in2.value)">
            </p>

            <p>
                <label for="isoma">Soma</label>
                <output id="isoma" name="soma">Soma 0</output>
            </p>



            <input type="submit" value="Enviar">
            <input type="reset" value="Eliminar">




        </form>
   
</body>
</html>
